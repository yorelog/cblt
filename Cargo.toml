[package]
name = "cblt"
version = "0.6.2"
edition = "2024"

authors = ["Evgeny Igumnov <igumnovnsk@gmail.com>"]

repository = "https://github.com/evgenyigumnov/cblt"
license = "MIT"
description = "Safe and fast minimalistic web server, written in Rust, that serves files from a directory and proxies requests to another server."
keywords = ["web-server", "webserver", "load-balancer", "reverse-proxy", "file-server"]
categories = ["web-programming", "network-programming", "development-tools"]

exclude = ["benchmark", "assets"]


[[bin]]
name = "cblt"
path = "src/main.rs"


[dependencies]
tokio = { version = "1.54.1", default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
http = "1.5.0"
env_logger = "0.11.11"
log = "0.4.35"
kdl = "6.7.1"
bytes = "1.12.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
httparse = "1.10.1"
itoa = "1.0.19"
rustls = { version = "0.23.46"}
tokio-rustls = "0.26.6"
clap = { version = "4.6.8", features = ["derive"] }
futures-core = "0.3.34"
futures-util = "0.3.34"
async-compression = { version = "0.4.52", features = ["tokio", "gzip"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
heapless = "0.9.3"
humantime = "2.4.0"
fdlimit = "0.3.0"
mime_guess = "2.0.5"

#[target.'cfg(target_os = "linux")'.dependencies]
bollard = "0.21.1"

[features]
default = []
trace = []

[profile.release]
lto = true

